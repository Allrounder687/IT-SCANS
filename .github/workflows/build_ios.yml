name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without Code Signing
        run: flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          # The build outputs to build/ios/iphoneos/Runner.app
          # We need to package it into a Payload folder and zip it to create an IPA
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r IT-SCANS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: IT-SCANS-Unsigned-IPA
          path: IT-SCANS.ipa
