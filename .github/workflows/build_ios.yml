name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without Code Signing
        run: |
          # First, run flutter build to generate the Podfile (it might fail on signing)
          flutter build ios --release --no-codesign || true
          
          # Inject code signing disable flags into the existing post_install block in the Podfile
          cat << 'EOF' > patch_podfile.rb
          require 'fileutils'
          content = File.read('ios/Podfile')
          new_content = content.gsub(/flutter_additional_ios_build_settings\(target\)/, "flutter_additional_ios_build_settings(target)\n      target.build_configurations.each do |config|\n        config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'\n        config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'\n        config.build_settings['CODE_SIGN_IDENTITY'] = '-'\n        config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = '-'\n        config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'\n      end")
          File.write('ios/Podfile', new_content)
          EOF
          ruby patch_podfile.rb
          
          # Re-run pod install
          cd ios
          pod install
          cd ..
          
          # Build again to ensure Dart AOT is compiled (might still fail Flutter's internal validation, so we use || true)
          flutter build ios --release --no-codesign || true
          
          # Force the actual Xcode build natively to bypass Flutter's validator
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          cd ..

      - name: Install ldid
        run: brew install ldid

      - name: Package and Pseudo-sign into IPA
        run: |
          # Find the built Runner.app
          APP_PATH=$(find build ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found!"
            exit 1
          fi
          
          mkdir -p Payload
          mv "$APP_PATH" Payload/
          
          # Pseudo-sign the binary for jailbroken devices so it doesn't get Killed: 9
          echo "Pseudo-signing payload with ldid..."
          ldid -S Payload/Runner.app/Runner
          
          zip -r IT-SCANS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: IT-SCANS-Unsigned-IPA
          path: IT-SCANS.ipa
