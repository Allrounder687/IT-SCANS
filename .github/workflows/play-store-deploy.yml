name: Play Store Deploy

# Automated Google Play Console deployment via Fastlane supply.
# Requires GitHub Secrets:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   GOOGLE_PLAY_JSON_KEY (Service Account JSON for Google Play Developer API)

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - production
  push:
    tags:
      - "v*.*.*"

jobs:
  deploy_play_store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore & write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../release.jks
          EOF
          else
            echo "KEYSTORE_BASE64 secret not set — skipping Play Store upload."
          fi

      - name: Build release App Bundle
        if: secrets.KEYSTORE_BASE64 != ''
        run: flutter build appbundle --release

      - name: Setup Fastlane
        if: secrets.GOOGLE_PLAY_JSON_KEY != '' && secrets.KEYSTORE_BASE64 != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install Fastlane
        if: secrets.GOOGLE_PLAY_JSON_KEY != '' && secrets.KEYSTORE_BASE64 != ''
        run: gem install fastlane --no-document

      - name: Upload to Google Play Console
        if: secrets.GOOGLE_PLAY_JSON_KEY != '' && secrets.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          DEPLOY_TRACK: ${{ github.event.inputs.track || 'internal' }}
        run: fastlane deploy_track track:"$DEPLOY_TRACK"
