name: itscans
description: "A CamScanner-style document scanner (zero-cognitive-load design)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Scanning — wraps ML Kit Document Scanner (Android) / VisionKit (iOS)
  flutter_doc_scanner: ^0.0.16

  # State management (see docs/DECISIONS.md)
  provider: ^6.1.2

  # Local persistence
  path_provider: ^2.1.3
  sqflite: ^2.3.3

  # PDF export
  pdf: ^3.11.0

  # Share sheet
  share_plus: ^9.0.0

  # Monetization
  in_app_purchase: ^3.2.0
  shared_preferences: ^2.2.3

  # Fonts
  google_fonts: ^6.2.1
  flutter_pdfview: ^1.3.2

  # Cloud Sync
  google_sign_in: ^6.2.1
  googleapis: ^13.0.0
  googleapis_auth: ^1.4.1
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  google_mlkit_text_recognition: ^0.16.0
  pdfx: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Generates Android adaptive icon (foreground + background layers, so it
# adapts to circle/squircle/rounded-square across OEM launcher shapes) plus
# the legacy flat icon and Android 13+ monochrome themed-icon variant.
# Run: dart run flutter_launcher_icons (or scripts/generate-icons.sh)
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  min_sdk_android: 21

# Native (OS-level) splash — static only, since native splash can't run
# custom animation. The in-Flutter beam-wipe (docs/DESIGN_SYSTEM.md) takes
# over the instant this native splash hands off to the Flutter view.
flutter_native_splash:
  color: "#121214"
  image: assets/icon/icon.png
  android_12:
    color: "#121214"
    image: assets/icon/icon.png
